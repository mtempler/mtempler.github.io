<!-- Site Header -->
<header class="site-header parallax" id="home" data-scrollax-parent="true">

  <!-- Parallax Header Image -->
  <div class="parallax-wrapper">
    <div class="cover" style="background-color: #708090; height: 100%;" data-scrollax="properties: { 'translateY': '48%' }">
    </div>
  </div>

  <div class="container">

    <!-- Site Navigation Bar -->
    <div class="row site-navigation-bar parent">

      <!-- Logo -->
      <div class="col-sm-3 col-xs-6 logo child-center-v">
        <a href="{{ site.baseurl }}/index.html"><img src="{{ site.baseurl }}/images/logo.svg" width="420"
            alt="Fides et Ratio LLC"></a>
      </div>

      <!-- Toggle Mobile Menu -->
      <div class="col-xs-6 toggle-menu child-center-v">

        <!-- Burger -->
        <div class="navTrigger">
          <i></i><i></i><i></i>
        </div>

      </div>

      <!-- Navigation Bar -->
      <div class="col-sm-9 col-xs-12 navigation-bar child-center-v">

        <!-- Navigation Menu -->
        <nav id="navMenu" class="nav-menu">
          <ul class="menu">
            <li class="current-menu-item"><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#features">Features</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#testimonials">Testimonials</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="#team">Team</a></li>
            <li><a href="#prices">Prices</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>

      </div>


    </div>

    <!-- Site Header Banner -->
    <div class="row header-banner parent" data-scrollax="properties: { 'translateY': '48%', 'opacity': '1.4' }">

      <div class="heading-content text-center child-center-v">

        <!-- Heading Title -->
        <div class="row heading-title">
          <h2>{{ site.headter-tagline }}</h2>
          <hr class="small">
          <h1 class="thin">{{ site.header-title }}</h1>
        </div>

        <!-- Header Buttons -->
        <div class="row buttons-header" style="margin-bottom: 80px;">
          <div style="display:flex; flex-direction:column; align-items:center; gap:10px;">
            <a href="{{ site.header-focus-button.url }}" class="button-cta button-focus" style="width:280px; text-align:center;">TRUE MEASUREMENTS</a>
            <a href="{{ site.header-secondary-button.url }}" class="button-cta" style="width:280px; text-align:center;">DATA DICTIONARY</a>
          </div>
        </div>

	<!-- Arrow Down -->
        <div class="row arrow-down-section" data-scrollax="properties: { 'opacity': '0.6' }">
          <div class="wrapper-arrow child-center">
            <a href="#about" class="arrow-down">
              <i class="pe-7s-angle-down"></i>
            </a>
          </div>
        </div>
</header>
