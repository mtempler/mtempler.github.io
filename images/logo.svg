<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="30 30 450 100" role="img">
  <title>Fides et Ratio</title>
  <desc>Wordmark logo for Fides et Ratio LLC</desc>

  <style>
    .logo-word { font-family: Georgia, 'Times New Roman', serif; font-size: 42px; font-weight: 400; letter-spacing: 2px; fill: #1a2640; }
    .logo-et { font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: 400; font-style: italic; fill: #2e7eff; letter-spacing: 1px; }
    .logo-sub { font-family: Arial, sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 6px; fill: #6b7fa3; }
  </style>

  <circle cx="54" cy="68" r="22" fill="none" stroke="#2e7eff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="74" cy="68" r="22" fill="none" stroke="#1a2640" stroke-width="1.5" opacity="0.7"/>
  <circle cx="64" cy="68" r="4" fill="#2e7eff" opacity="0.85"/>

  <line x1="108" y1="38" x2="108" y2="98" stroke="#d0daea" stroke-width="1"/>

  <text y="86" x="124" class="logo-word">FIDES <tspan class="logo-et" dy="-3">et</tspan><tspan class="logo-word" dy="3"> RATIO</tspan></text>
  <text x="124" y="114" class="logo-sub">LLC</text>

</svg>
